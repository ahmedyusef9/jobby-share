    source: matrix
    touches:
      - web/src/auth.ts
      - web/src/lib/auth/**
      - web/src/lib/account-lifecycle.ts
      - web/src/lib/accounts.ts
      - web/src/app/api/admin/accounts/**
    criteria:
      - id: ACCESS-L1-01
        expected: suspension makes an existing MCP key return 401 immediately
        level: api
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L1 suspended member loses MCP access"
      - id: ACCESS-L1-02
        expected: a stale session cookie on / lands on the sign-in form, never ERR_TOO_MANY_REDIRECTS
        level: ui
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L1 suspended member loses MCP access"
      - id: ACCESS-L1-03
        expected: after reactivation a fresh sign-in works without deleting cookies by hand
        level: ui
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L1 suspended member loses MCP access"
      - id: ACCESS-L1-04
        expected: /signin itself also settles for a stale cookie (the matrix requires both routes, the test only visits /)
        level: ui
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L1 suspended member loses MCP access"

