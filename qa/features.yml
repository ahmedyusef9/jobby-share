# qa/features.yml — the coverage denominator.
#
# "Full coverage" is meaningless without a written-down list of what
# "full" is. This file IS that list: every acceptance criterion the
# product is expected to satisfy, whether or not anything tests it yet.
#
# Sources (a criterion may not be invented — it must trace to one):
#   matrix   deploy/qa/mcp-multi-user-matrix.md
#   round8   deploy/qa/round-8-prompt.md
#   rule     .cursor/rules/80-qa-manual.mdc
#   roadmap  .jobby/ROADMAP.md
#
# automated_by: "<spec file>::<unique substring of the test title>".
# scripts/qa-coverage.mjs resolves every one of these against the real
# Playwright test list, so a renamed or deleted test breaks the build
# instead of silently inflating the number.
#
# A criterion with neither automated_by nor manual_only is an open GAP.
#
# touches: source globs that own the feature's behaviour. When a commit changes
# one of them, scripts/qa-report.mjs marks that feature's criteria STALE — they
# were verified against code that no longer exists and must be re-run this
# round. This is what makes an incremental round honest instead of cumulative.

version: 1
product: jobby
release: v0.6.0

risk_order: [critical, high, medium, low]

features:

  - id: MCP-PROTO
    title: MCP streamable-HTTP transport conformance
    surface: mcp
    risk: high
    source: roadmap
    touches:
      - web/src/app/api/mcp/**
      - web/src/lib/mcp-jsonrpc.ts
      - web/src/lib/mcp/**
    criteria:
      - id: MCP-PROTO-01
        expected: initialize over application/json returns a spec-conformant result
        level: api
        automated_by: "test/web-e2e/conformance.spec.mjs::1. initialize over application/json"
      - id: MCP-PROTO-02
        expected: a key supplied via Authorization Bearer is accepted
        level: api
        automated_by: "test/web-e2e/conformance.spec.mjs::2. key via Authorization Bearer"
      - id: MCP-PROTO-03
        expected: GET with Accept text/event-stream opens an SSE handshake
        level: api
        automated_by: "test/web-e2e/conformance.spec.mjs::3. GET /api/mcp with Accept"
      - id: MCP-PROTO-04
        expected: POST over SSE returns a message event
        level: api
        automated_by: "test/web-e2e/conformance.spec.mjs::4. POST over SSE"
      - id: MCP-PROTO-05
        expected: tools/list round-trips over SSE
        level: api
        automated_by: "test/web-e2e/conformance.spec.mjs::5. tools/list round-trips over SSE"
      - id: MCP-PROTO-06
        expected: a batch request (array of messages) is accepted
        level: api
        automated_by: "test/web-e2e/conformance.spec.mjs::6. batch request"
      - id: MCP-PROTO-07
        expected: notifications produce an empty 202 with no JSON-RPC body
        level: api
        automated_by: "test/web-e2e/conformance.spec.mjs::7. notifications produce an empty 202"
      - id: MCP-PROTO-08
        expected: an unknown method maps to JSON-RPC method-not-found (-32601)
        level: api
        automated_by: "test/web-e2e/conformance.spec.mjs::8. unknown method"
      - id: MCP-PROTO-09
        expected: an oversized payload is rejected before dispatch
        level: api
        automated_by: "test/web-e2e/conformance.spec.mjs::9. payload too large"
      - id: MCP-PROTO-10
        expected: CORS exposes Mcp-Session-Id on the mcp route
        level: api
        automated_by: "test/web-e2e/conformance.spec.mjs::10. CORS exposes Mcp-Session-Id"
      - id: MCP-PROTO-11
        expected: a stale explicit key gets a JSON 401, not the public initialize fallback
        level: api
        automated_by: "test/web-e2e/conformance.spec.mjs::11. stale explicit key"

