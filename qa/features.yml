        automated_by: "test/web-e2e/zero-key.spec.mjs::operator Config keeps engine chooser"

  - id: ACCESS-L2-SCOPE
    title: L2 scoped-key enforcement (read / read-write / revoked / expired)
    surface: mcp
    risk: critical
    source: matrix
    touches:
      - web/src/lib/mcp-tokens.ts
      - web/src/lib/key-store.ts
      - web/src/app/api/account/mcp/**
      - web/src/app/api/mcp/**
    criteria:
      - id: ACCESS-L2-SCOPE-01
        expected: a read key can call whoami and search_applications
        level: api
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L2 read key reads but cannot mutate"
      - id: ACCESS-L2-SCOPE-02
        expected: a read key's add_application returns a read-only error and persists nothing
        level: api
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L2 read key reads but cannot mutate"
      - id: ACCESS-L2-SCOPE-03
        expected: a read key's resume_update is refused
        level: api
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L2 read key reads but cannot mutate"
      - id: ACCESS-L2-SCOPE-04
        expected: a read key's submit_score is refused
        level: api
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L2 read key reads but cannot mutate"
      - id: ACCESS-L2-SCOPE-05
        expected: a read-write key mutates only its own tenant
        level: api
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L2 read-write key can mutate its own tenant"
      - id: ACCESS-L2-SCOPE-06
        expected: a revoked key returns 401 while another key stays live
        level: api
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L2 revoked key is rejected"
      - id: ACCESS-L2-SCOPE-07
        expected: 'an expired key returns HTTP 401 with the guidance "expired — mint a fresh key under Account → MCP"'
        level: api
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L2 expired key returns 401 and frees the live-key cap"
      - id: ACCESS-L2-SCOPE-08
        expected: an expired key shows a red `expired` pill in Account → MCP and frees the live-key cap
        level: ui
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L2 expired key returns 401 and frees the live-key cap"

