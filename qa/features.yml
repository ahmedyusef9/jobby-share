        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L2 two-member tokens cannot cross tenant"
      - id: ACCESS-L2-TENANT-03
        expected: managing another member's key document returns 404 and leaves that key live
        level: api
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L2 two-member tokens cannot cross tenant"

