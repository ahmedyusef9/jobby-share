    touches:
      - web/src/auth.ts
      - web/src/proxy.ts
      - web/src/lib/auth/**
      - web/src/app/api/mcp/**
    criteria:
      - id: ACCESS-L0-01
        expected: a signed-out member route redirects to sign-in
        level: ui
        automated_by: "test/web-e2e/smoke.spec.mjs::signed-out /pipeline lands on /signin"
      - id: ACCESS-L0-02
        expected: signed-out /admin redirects to sign-in and serves no operator surface
        level: ui
        automated_by: "test/web-e2e/smoke.spec.mjs::signed-out /admin redirects"
      - id: ACCESS-L0-05
        expected: signed-out /admin/rbac redirects to sign-in and serves no operator surface
        level: ui
        automated_by: "test/web-e2e/smoke.spec.mjs::signed-out /admin/rbac redirects"
      - id: ACCESS-L0-03
        expected: public tools/list succeeds without a key (public by design)
        level: api
        automated_by: "test/web-e2e/multi-level-mcp.spec.mjs::L0 anonymous can list tools"
      - id: ACCESS-L0-04
        expected: tools/call without a key returns 401
        level: api
        automated_by: "test/web-e2e/mcp-tools.spec.mjs::L0: unkeyed tools/call is rejected"

  - id: ACCESS-L1
    title: L1 suspended member
