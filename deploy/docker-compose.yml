# Local-first multi-service POC (parity with Railway).
# Usage (from repo root):
#   cp deploy/.env.example deploy/.env   # optional
#   # JOBBY_WEB_PORT must match .ports.yml services.compose-web (host publish).
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#
# Data stays on the host via CAREER_OPS_ROOT bind-mount (./ → /data).
#
# JOBBY_HOST_ROOT must be the host path of this repo: the dispatcher talks to
# the host Docker socket, so sandbox bind mounts are resolved on the host.

# Not `jobby`: the repo-root (upstream career-ops) compose already claims that
# project name, and sharing it makes each stack look like the other's orphans.
name: jobby-deploy

networks:
  default:
    name: jobby_internal
  sandbox:
    name: jobby_sandbox

services:
  redis:
    image: redis:7-alpine
    # Internal only — never published on the host. Redis here has no password and
    # holds the job queue, so publishing 6379 hands anyone on the network the
    # ability to read, forge or delete other people's jobs. This is enforced by
    # the absence of a `ports:` key; adding one is not a configuration choice.
    restart: unless-stopped
    networks: [default]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      # Host port is this project's reserved mapping (.ports.yml compose-web),
      # not 3001 (that was a leftover so host next could keep :3000). Inside
      # the container Next always binds 3000.
      #
      # Bound to loopback by default (M7 phase 5). The previous form published on
      # 0.0.0.0, so the app answered anyone on the LAN — a coffee-shop network is
      # not an audience for other people's CVs. Tailscale Funnel and Cloudflare
      # both proxy from the host itself, so loopback is enough for them; set
      # JOBBY_BIND_ADDR to this machine's tailnet address (100.x.y.z) to serve
      # the tailnet directly instead.
      - "${JOBBY_BIND_ADDR:-127.0.0.1}:${JOBBY_WEB_PORT:-4700}:3000"
    environment:
      - NODE_ENV=production
      - CAREER_OPS_ROOT=/data
      - REDIS_URL=redis://redis:6379
      - JOBBY_ALLOW_API_KEY=${JOBBY_ALLOW_API_KEY:-1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JOBBY_CLAUDE_MODEL=${JOBBY_CLAUDE_MODEL:-}
      - JOBBY_CURSOR_MODEL=${JOBBY_CURSOR_MODEL:-}
      # Reach host Ollama from containers (Docker Desktop / Linux host-gateway).
      - JOBBY_OLLAMA_BASE_URL=${JOBBY_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - JOBBY_OLLAMA_MODEL=${JOBBY_OLLAMA_MODEL:-}
      - OPENCODE_MODEL=${OPENCODE_MODEL:-omniroute/auto/best-coding}
      # JOBBY_* names avoid host OMNIROUTE_BASE_URL=localhost:22128 leaking into compose.
      - JOBBY_OMNIROUTE_BASE_URL=${JOBBY_OMNIROUTE_BASE_URL:-https://your-gateway.your-tailnet.ts.net:8443/v1}
      - JOBBY_OMNIROUTE_API_KEY=${JOBBY_OMNIROUTE_API_KEY:-}
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT:-}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - JOBBY_SCAN_DAILY_LIMIT=${JOBBY_SCAN_DAILY_LIMIT:-}
      - JOBBY_SCAN_CONCURRENCY=${JOBBY_SCAN_CONCURRENCY:-1}
      - JOBBY_WORKER_CONCURRENCY=${JOBBY_WORKER_CONCURRENCY:-1}
      - JOBBY_MASTER_KEY=${JOBBY_MASTER_KEY:-}
      - JOBBY_KEY_BACKEND=${JOBBY_KEY_BACKEND:-local}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_URL=${AUTH_URL:-http://localhost:4700}
      - JOBBY_MCP_PUBLIC_URL=${JOBBY_MCP_PUBLIC_URL:-}
      - JOBBY_APP_PUBLIC_URL=${JOBBY_APP_PUBLIC_URL:-}
      - AUTH_SINGLE_TENANT=${AUTH_SINGLE_TENANT:-1}
      - JOBBY_OPERATOR_SECRET=${JOBBY_OPERATOR_SECRET:-}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID:-}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET:-}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - AUTH_ALLOWED_EMAILS=${AUTH_ALLOWED_EMAILS:-}
      - NEXT_PUBLIC_AUTH_GITHUB=${NEXT_PUBLIC_AUTH_GITHUB:-}
      - NEXT_PUBLIC_AUTH_GOOGLE=${NEXT_PUBLIC_AUTH_GOOGLE:-}
      - JOBBY_TENANT_ID=${JOBBY_TENANT_ID:-default}
      - JOBBY_JOBSPY_PYTHON=${JOBBY_JOBSPY_PYTHON:-/opt/jobspy/bin/python}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/data
    depends_on:
      - redis
    shm_size: "1gb"
    restart: unless-stopped

  worker:
    image: jobby-worker:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      - NODE_ENV=production
      - CAREER_OPS_ROOT=/data
      - REDIS_URL=redis://redis:6379
      - JOBBY_ALLOW_API_KEY=${JOBBY_ALLOW_API_KEY:-1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JOBBY_CLAUDE_MODEL=${JOBBY_CLAUDE_MODEL:-}
      - JOBBY_OLLAMA_BASE_URL=${JOBBY_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - JOBBY_OLLAMA_MODEL=${JOBBY_OLLAMA_MODEL:-}
      - OPENCODE_MODEL=${OPENCODE_MODEL:-omniroute/auto/best-coding}
      # JOBBY_* names avoid host OMNIROUTE_BASE_URL=localhost:22128 leaking into compose.
      - JOBBY_OMNIROUTE_BASE_URL=${JOBBY_OMNIROUTE_BASE_URL:-https://your-gateway.your-tailnet.ts.net:8443/v1}
      - JOBBY_OMNIROUTE_API_KEY=${JOBBY_OMNIROUTE_API_KEY:-}
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT:-}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - JOBBY_SCAN_DAILY_LIMIT=${JOBBY_SCAN_DAILY_LIMIT:-}
      - JOBBY_SCAN_CONCURRENCY=${JOBBY_SCAN_CONCURRENCY:-1}
      - JOBBY_WORKER_CONCURRENCY=${JOBBY_WORKER_CONCURRENCY:-1}
      - JOBBY_MASTER_KEY=${JOBBY_MASTER_KEY:-}
      - JOBBY_KEY_BACKEND=${JOBBY_KEY_BACKEND:-local}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_URL=${AUTH_URL:-http://localhost:4700}
      - AUTH_SINGLE_TENANT=${AUTH_SINGLE_TENANT:-1}
      - JOBBY_OPERATOR_SECRET=${JOBBY_OPERATOR_SECRET:-}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID:-}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET:-}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - AUTH_ALLOWED_EMAILS=${AUTH_ALLOWED_EMAILS:-}
      - NEXT_PUBLIC_AUTH_GITHUB=${NEXT_PUBLIC_AUTH_GITHUB:-}
      - NEXT_PUBLIC_AUTH_GOOGLE=${NEXT_PUBLIC_AUTH_GOOGLE:-}
      - JOBBY_TENANT_ID=${JOBBY_TENANT_ID:-default}
      - JOBBY_JOBSPY_PYTHON=${JOBBY_JOBSPY_PYTHON:-/opt/jobspy/bin/python}
      - JOBBY_SANDBOX=1
      - JOBBY_SANDBOX_IMAGE=jobby-worker:local
      - JOBBY_SANDBOX_NETWORK=jobby_sandbox
      # Nested ${PWD} is not interpolated by Compose — it started the dispatcher
      # with a blank HOST_ROOT and every Score died. Fail closed instead.
      - JOBBY_HOST_ROOT=${JOBBY_HOST_ROOT:?set JOBBY_HOST_ROOT in deploy/.env to this checkout's absolute path}
      - JOBBY_WORKER_ID=dispatcher
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    shm_size: "1gb"
    restart: unless-stopped
    networks: [default]

  # Optional: enqueue a periodic scan (every 6h). Disable with profile.
  scheduler:
    profiles: ["scheduler"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      - NODE_ENV=production
      - CAREER_OPS_ROOT=/data
      - REDIS_URL=redis://redis:6379
      - JOBBY_SCHEDULER=1
      - JOBBY_SCAN_CRON=${JOBBY_SCAN_CRON:-0 */6 * * *}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - JOBBY_TENANT_ID=${JOBBY_TENANT_ID:-default}
    volumes:
      - ..:/data
    depends_on:
      - redis
    command: ["node", "deploy/worker/scheduler.mjs"]
    restart: unless-stopped
